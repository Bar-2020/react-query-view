name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted Publishing needs npm >= 11.5.1; the version bundled with
      # Node 22 is older, so update it before publishing. No NPM_TOKEN
      # needed: npm exchanges this job's OIDC token (from id-token: write)
      # for a short-lived publish token, once a trusted publisher for this
      # repo + workflow is configured on the package's npmjs.com settings.
      - run: npm install -g npm@latest
      - run: npm publish
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
